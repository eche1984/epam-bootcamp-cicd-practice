name: Deploy to Minikube using GitHub Actions

on: [push]
  
jobs:
  job1:
    runs-on: ubuntu-latest
    name: build Node.js Docker Image and deploy to minikube
    steps:
    - uses: actions/checkout@v2
    - name: Start minikube
      uses: medyagh/setup-minikube@master
    - name: Try the cluster !
      run: kubectl get pods -A
    - name: Build image
      run: |
          export SHELL=/bin/bash
          eval $(minikube -p minikube docker-env)
          docker build -f ./Dockerfile -t devopshint/node-app:latest .
          echo -n "verifying images:"
          docker images         
    - name: Deploy to minikube
      run:
        kubectl apply -f k8s-node-app.yaml
    - name: Wait for deployment
      run: |
        echo "Waiting for the pod to be ready..."
        kubectl wait --for=condition=ready pod -l app=nodejs-app --timeout=90s || true
        echo "=== Pods en el cluster ==="
        kubectl get pods
        echo "=== Describiendo el pod (si existe) ==="
        kubectl describe pod -l app=nodejs-app || echo "No se encontraron pods"
        echo "=== Logs del pod (si existe) ==="
        kubectl logs -l app=nodejs-app || echo "No logs disponibles"
        echo "=== Esperando 30 segundos para que el pod inicie ==="
        sleep 30
        kubectl get pods
    - name: Debug deployment status
      run: |
        kubectl get pods
        kubectl describe pod -l app=nodejs-app
        kubectl logs -l app=nodejs-app || echo "No logs yet"
    - name: Test service URLs
      run: |
          minikube service list
          minikube service nodejs-app --url
          echo "=== Probando servicio con port-forward ==="
          kubectl port-forward service/nodejs-app 3000:80 &
          sleep 5
          curl http://localhost:3000 && echo "✅ Servicio responde correctamente" || echo "❌ Servicio no responde"
